# MuDeskClient - https://miguelenred.es/mudeskclient - Apache License 2.0
# HTTPS only; the web root is public/ (src/, data/ and the rest are out of reach); public/.htaccess applies.

# Apache processes at once (prefork: one a request; each RDP session holds one, its keyboard and mouse up to 4 more while
# used, and 2 more with the camera, this computer's folder or a recording; each guest one): MUDESK_WORKERS, 256 by default
# (the entrypoint checks it). Apache's own 150 is about what 20 sessions in use may take at once.
<IfModule mpm_prefork_module>
    ServerLimit ${MUDESK_WORKERS}
    MaxRequestWorkers ${MUDESK_WORKERS}
</IfModule>

<VirtualHost *:443>
    DocumentRoot /var/www/mudesk/public
    SSLEngine on
    SSLCertificateFile /etc/mudesk/tls/cert.pem
    SSLCertificateKeyFile /etc/mudesk/tls/key.pem
    # no request of MuDeskClient sends more than 4 MB: a larger body is refused before PHP is given it
    LimitRequestBody 8388608
    <Directory /var/www/mudesk/public>
        AllowOverride All
        Require all granted
    </Directory>
    # the optional WebSocket service (tools/ws-server.php; the image starts it, install.sh makes it the service mudesk-ws):
    # /ws passed to it with the site's Host and the client's scheme (and address, X-Forwarded-For); when it does not answer,
    # the page uses HTTP, as always
    <Location /ws>
        ProxyPass ws://127.0.0.1:8091/ws
        ProxyPreserveHost On
        RequestHeader set X-Forwarded-Proto https
    </Location>
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
