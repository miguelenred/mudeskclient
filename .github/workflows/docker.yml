# MuDeskClient - https://miguelenred.es/mudeskclient - Apache License 2.0
# The Docker image of each released version, published in GitHub's container registry as
# ghcr.io/miguelenred/mudeskclient:<version> and :latest, and on Docker Hub as miguelenred/mudeskclient when the repository has
# the secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN (a Docker Hub access token with write access); the image is tested by the
# "docker" job of tests.yml on every push.
name: docker

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Image built and pushed with its version and as latest
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HUB_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          HUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          v="${GITHUB_REF_NAME#v}"
          images=ghcr.io/miguelenred/mudeskclient
          echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          # the same image on Docker Hub too, when its secrets are set (without them: GitHub's registry only, as before)
          if [ -n "$HUB_USER" ] && [ -n "$HUB_TOKEN" ]; then
            echo "$HUB_TOKEN" | docker login -u "$HUB_USER" --password-stdin
            images="$images docker.io/miguelenred/mudeskclient"
          fi
          # :latest only for a release (not for one such as 1.2.0-rc1)
          latest=yes
          case "$v" in *-*) latest= ;; esac
          tags=
          for i in $images; do
            tags="$tags -t $i:$v"
            if [ -n "$latest" ]; then tags="$tags -t $i:latest"; fi
          done
          docker build $tags \
            --label org.opencontainers.image.source=https://github.com/miguelenred/mudeskclient \
            --label org.opencontainers.image.version="$v" \
            --label org.opencontainers.image.licenses=Apache-2.0 .
          for i in $images; do
            docker push "$i:$v"
            if [ -n "$latest" ]; then docker push "$i:latest"; fi
          done
