# MuDeskClient - https://miguelenred.es/mudeskclient - Apache License 2.0
# MuDeskClient with Docker Compose: `docker compose up -d` in this folder, then open https://localhost:8443 and type the
# setup code: docker compose exec mudesk cat /var/www/mudesk/data/setup-code.php (its second line).
# It runs the published image; to build the image from this folder's code instead, uncomment the line "build: ." and
# start it with `docker compose up -d --build`. See "Option D: Docker" in docs/INSTALL.md.
services:
  mudesk:
    # the image of this version: it does not change by itself ("latest" would bring each new version without asking); to
    # update, put the new version's number here, then `docker compose pull` and `docker compose up -d`
    image: ghcr.io/miguelenred/mudeskclient:1.3.0
    # build: .
    container_name: mudesk
    restart: unless-stopped
    ports:
      - "8443:443"
    volumes:
      - mudesk-data:/var/www/mudesk/data   # users, connections and settings: kept when the container is made again
      - mudesk-tls:/etc/mudesk/tls         # the self-signed certificate made at the first start (or your cert.pem and key.pem)
    # environment:
    #   MUDESK_HOSTNAME: mudesk.example.com   # the name in the self-signed certificate
    #   MUDESK_WORKERS: 256                   # Apache processes at once (docs/HOSTING.md, Capacity)
    # its logs rotated (Docker keeps them without limit otherwise) and no privilege gained inside; its health (health.php,
    # every 30 s, from the image) shows in `docker compose ps`
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    security_opt:
      - no-new-privileges:true
    # memory and CPU at most, for the sessions you expect (docs/HOSTING.md, Capacity: 2 GB and 2 CPUs, some 25–35 sessions)
    # deploy:
    #   resources:
    #     limits:
    #       memory: 2g
    #       cpus: "2"

volumes:
  mudesk-data:
  mudesk-tls:
