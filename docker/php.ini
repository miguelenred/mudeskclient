; The RDP stream goes out as it is made: no output buffer, no compression. PHP's messages go to the log, never to the page.
output_buffering = Off
zlib.output_compression = Off
expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
memory_limit = 256M
